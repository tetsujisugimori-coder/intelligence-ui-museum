<!doctype html><html lang="ja"><meta charset="utf-8"><title>検証用フレーム</title><style>body{font-family:system-ui;background:#ddd;margin:16px}label{margin-right:20px}iframe{display:block;margin-top:20px;height:900px;border:2px solid #555;max-width:none}</style><h1>表示条件の検証</h1><label>幅 <select id="width"><option>320</option><option>375</option><option>390</option><option selected>1280</option></select></label><label>テーマ <select id="theme"><option>light</option><option>dark</option></select></label><label>文字 <select id="text"><option>100</option><option>200</option></select></label><p>フレーム内のviewport幅を指定。文字200はrootフォント200%であり、実機の文字拡大設定とは別の試験。</p><iframe title="検証対象アプリ" id="app" width="1280" src="./index.html?theme=light&text=100"></iframe><script>for(const el of document.querySelectorAll('select'))el.addEventListener('change',()=>{const frame=document.querySelector('iframe');frame.width=document.querySelector('#width').value;frame.src='./index.html?theme='+document.querySelector('#theme').value+'&text='+document.querySelector('#text').value;});</script></html>
