<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape cancellation controlled model fixture</title>
<style>
:root{font:16px system-ui,sans-serif;background:#f8faf9;color:#15251f}
*{box-sizing:border-box}
main{padding:28px;max-width:540px}
button{font:inherit;border:1px solid #566c62;border-radius:8px;background:white;color:inherit;padding:12px 18px}
button:focus-visible{outline:3px solid #c66a20;outline-offset:4px}
#menu{padding:14px 0}
#choice{display:block}
output{display:block;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Escape close/cancel isolated model</h1>
<p>実SDKではなく、閉鎖要求と取消を分離するためのモデル実験です。</p>
<button id="trigger" type="button" aria-expanded="false" aria-controls="menu">項目を選ぶ</button>
<div id="menu" role="listbox" hidden>
<button type="button" id="choice" role="option" aria-selected="true">一覧</button>
</div>
<output id="value">選択値: a</output>
</main>
<script src="./fixture.js"></script>
</body>
</html>
