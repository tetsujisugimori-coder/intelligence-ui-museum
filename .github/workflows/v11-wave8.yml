name: v11 Wave 8
on:
  pull_request:
    paths: ['apps/v11/**', '.github/workflows/v11-wave8.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wave8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.work/wave8-temp
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.work/wave8-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p "$TMPDIR" .work/wave8-app && cp -R apps/v11/. .work/wave8-app/
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium webkit
        working-directory: .work/wave8-app
      - run: python3 apps/v11/verify.py && node --test apps/v11/wave8-test.cjs
      - run: node apps/v11/wave8-browser.cjs
        env:
          APP_ROOT: .work/wave8-app
          EVIDENCE_DIR: .work/wave8-evidence
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.work/wave8-app/node_modules/playwright
      - run: node apps/v11/wave8-faults.cjs
        env:
          APP_ROOT: .work/wave8-app
          EVIDENCE_DIR: .work/wave8-evidence
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.work/wave8-app/node_modules/playwright
      - if: always()
        run: node apps/v11/wave8-audit.cjs .work/wave8-evidence
      - run: node apps/v11/wave8-audit-negative.cjs .work/wave8-evidence
      - name: Manifest original execution evidence
        if: always()
        run: python3 apps/v11/wave8-manifest.py .work/wave8-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-wave8-evidence
          path: .work/wave8-evidence
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
