name: Select operation path pilot
on:
  pull_request:
    paths:
      - 'tests/select-path-pilot/**'
      - 'docs/select-path-pilot/**'
      - 'evidence/select-path-pilot-20261109/**'
      - '.github/workflows/select-path-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: select-path-pilot-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated sources and locked dependencies
        shell: bash
        run: |
          python scripts/prepare-work.py
          npm --prefix .work/v10 ci --ignore-scripts --no-audit --no-fund
          npm --prefix .work/v10 run build
          node tests/sdk-parity/prepare.cjs
          npm --prefix .work/sdk-parity ci --ignore-scripts --no-audit --no-fund
          (cd .work/sdk-parity && VITE_MEASURE=detail node node_modules/vite/bin/vite.js build --config vite.config.mjs)
          npm --prefix tools/stage-a-browser ci --ignore-scripts --no-audit --no-fund
          cd tools/stage-a-browser
          if [ '${{ runner.os }}' = 'Linux' ]; then npx playwright install --with-deps webkit; else npx playwright install webkit; fi
      - name: Existing and new comparator negative controls
        shell: bash
        run: |
          node --test tests/select-path-pilot/contract.test.cjs tests/sdk-parity/compare.test.cjs tests/select-escape-minimal/classify.test.cjs
          python scripts/verify-migration.py
      - name: Fixed 36-trial pilot with diagnostic failure preserved
        shell: bash
        env:
          PATH_ENGINE: webkit
          PATH_OUT: .work/path-evidence/raw
        run: |
          mkdir -p .work/path-evidence
          set +e
          node tests/select-path-pilot/run.cjs > .work/path-evidence/runner.log 2>&1
          code=$?
          echo "$code" > .work/path-evidence/runner-exit.txt
          python tests/select-path-pilot/audit.py .work/path-evidence/raw > .work/path-evidence/audit.json 2> .work/path-evidence/audit-stderr.txt
          audit=$?
          echo "$audit" > .work/path-evidence/audit-exit.txt
          cat .work/path-evidence/runner.log
          if [ "$code" != 0 ] || [ "$audit" != 0 ]; then exit 1; fi
      - name: Preserve original product and prior evidence
        if: always()
        shell: bash
        run: |
          git diff --exit-code -- apps/v10 tests/sdk-parity tests/select-escape-minimal archive reviews
          python scripts/verify-migration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: select-path-pilot-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .work/path-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
