name: Select round 11 operation group isolation
on:
  pull_request:
    paths:
      - 'tests/select-round11/**'
      - 'tests/select-round11-review/**'
      - 'docs/select-round11/**'
      - '.github/workflows/select-round11.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: select-round11-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        phase: [A, B, B2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build preserved Museum and install fixed WebKit
        shell: bash
        run: |
          python scripts/prepare-work.py
          npm --prefix .work/v10 ci --ignore-scripts --no-audit --no-fund
          npm --prefix .work/v10 run build
          npm --prefix tools/stage-a-browser ci --ignore-scripts --no-audit --no-fund
          if [ '${{ runner.os }}' = 'Linux' ]; then
            (cd tools/stage-a-browser && npx playwright install --with-deps webkit)
          else
            (cd tools/stage-a-browser && npx playwright install webkit)
          fi
      - name: Preregistration contract and prior evidence protection
        shell: bash
        run: |
          node --test tests/select-round11/contract.test.cjs tests/select-round11/privacy.test.cjs tests/select-round11/negative-review.test.cjs tests/select-factor-pilot/contract.test.cjs
          python tests/select-round11-review/trace-counterexamples.py
          node tests/select-round11-review/B-contract.cjs
          python scripts/verify-migration.py
          git diff --exit-code a373160f9d7e1b726b51d3a3f6de3e65024699c7 -- apps archive reviews legacy tests/select-factor-pilot docs/select-factor-pilot tests/select-round10 docs/select-round10 evidence
      - name: New standalone observation pilot and local raw audit
        id: evidence
        env:
          ROUND11_PHASE: ${{ matrix.phase }}
        shell: bash
        run: |
          mkdir -p .work/round11-report
          set +e
          ROUND11_OUT=.work/select-round11 node tests/select-round11/run.cjs > .work/round11-report/runner.log 2> .work/round11-report/runner-stderr.log
          runner=$?
          echo "$runner" > .work/round11-report/runner-exit.txt
          ROUND11_RUNNER_EXIT=$runner ROUND11_EXPECT_HEAD=$(git rev-parse HEAD) ROUND11_EXPECT_PLATFORM=$(node -p process.platform) node tests/select-round11/audit.cjs .work/select-round11 > .work/round11-report/audit-local.json 2> .work/round11-report/audit-stderr.txt
          auditor=$?
          echo "$auditor" > .work/round11-report/auditor-exit.txt
          # Fixed-code gate reports only; never print candidate raw bytes or exception text.
          ROUND11_RUNNER_EXIT=$runner ROUND11_AUDITOR_EXIT=$auditor ROUND11_EXPECT_HEAD=$(git rev-parse HEAD) node tests/select-round11/privacy-check.cjs .work/select-round11 > .work/round11-report/privacy.json
          privacy=$?
          echo "privacy=$privacy" >> "$GITHUB_OUTPUT"
          cat .work/round11-report/privacy.json
          # Candidate logs can contain private error text; keep them local only.
          rm -f .work/round11-report/runner.log .work/round11-report/runner-stderr.log .work/round11-report/audit-stderr.txt
          if [ "$privacy" -eq 0 ]; then cp .work/select-round11/SHA256SUMS.json .work/round11-report/original-hashes.json; fi
          ROUND11_AUDITOR_EXIT=$auditor node -e 'const fs=require("node:fs");let n=null;try{const x=JSON.parse(fs.readFileSync(".work/round11-report/audit-local.json"));n=Array.isArray(x.errors)?x.errors.length:null}catch{}fs.writeFileSync(".work/round11-report/audit.json",JSON.stringify({diagnostic:process.env.ROUND11_AUDITOR_EXIT==="0"?"PASS":"FAIL",errorCount:n,rootCause:"UNKNOWN",stage3:"HOLD",details:"Raw auditor messages retained locally only"}))'
          cat .work/round11-report/audit.json
          if [ "$runner" -ne 0 ] || [ "$auditor" -ne 0 ] || [ "$privacy" -ne 0 ]; then exit 1; fi
      - name: Upload checked synthetic localhost raw evidence
        if: success() && steps.evidence.outputs.privacy == '0'
        uses: actions/upload-artifact@v4
        with:
          name: select-round11-raw-${{ matrix.phase }}-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .work/select-round11/
          include-hidden-files: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload redacted diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-round11-summary-${{ matrix.phase }}-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .work/round11-report/audit.json
            .work/round11-report/privacy.json
            .work/round11-report/runner-exit.txt
            .work/round11-report/auditor-exit.txt
            .work/round11-report/original-hashes.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
