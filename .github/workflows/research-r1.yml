name: Research R1 inventory
on:
  pull_request:
    paths:
      - 'docs/research/r1/**'
      - 'scripts/research/r1/**'
      - '.github/workflows/research-r1.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      DIR: .work/r1-ci-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record execution identity
        run: |
          set -euo pipefail
          mkdir -p "$DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS"
            python3 --version
            node --version
          } > "$DIR/execution.txt"
      - name: Verify inventory and fault controls
        run: |
          set -euo pipefail
          python3 scripts/research/r1/catalog.py | tee "$DIR/catalog.json"
          python3 scripts/research/r1/test_catalog.py -v 2>&1 | tee "$DIR/tests.txt"
          node scripts/research/r1/probe-bindings.cjs apps/v11 | tee "$DIR/bindings.txt"
          python3 apps/v11/verify.py | tee "$DIR/legacy.txt"
      - name: Manifest
        if: always()
        run: |
          test -d "$DIR"
          (cd "$DIR" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum) > "$DIR/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-r1-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: .work/r1-ci-evidence/
          if-no-files-found: error
          retention-days: 30
