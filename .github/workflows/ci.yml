name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kanban_failure_control:
        description: 'Intentionally erase review suffix pixels after fresh capture (Kanban must fail)'
        type: boolean
        default: false
      kanban_audit_test_failure:
        description: 'Intentionally fail the audit CLI test suite after checks (CI must fail)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TMPDIR: ${{ runner.temp }}/museum-wave1
      TMP: ${{ runner.temp }}/museum-wave1
      TEMP: ${{ runner.temp }}/museum-wave1
      npm_config_cache: ${{ runner.temp }}/museum-wave1/npm-cache
    steps:
      - name: Prepare per-job temporary area
        run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-migration.py
      - run: npm run test:runner
      - run: python3 apps/v11/verify.py
      - run: node --check apps/v11/exhibits.js
      - run: node --test apps/v11/result-contract.test.cjs apps/v11/transfer-contract.test.cjs apps/v11/text-zoom-contract.test.cjs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMPDIR: ${{ runner.temp }}/museum-wave1
      TMP: ${{ runner.temp }}/museum-wave1
      TEMP: ${{ runner.temp }}/museum-wave1
      npm_config_cache: ${{ runner.temp }}/museum-wave1/npm-cache
    steps:
      - name: Prepare per-job temporary area
        run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/v10/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/prepare-work.py
      - run: npm ci --ignore-scripts
        working-directory: .work/v10
      - run: npm run build
        working-directory: .work/v10
      - run: npm test
        working-directory: .work/v10
      - run: node scripts/verify-baseline.mjs
        working-directory: .work/v10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-verification-${{ github.sha }}
          path: |
            .work/v10/dist/
            .work/v10/evidence/authenticity-tests.json

  browser-stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: regression
            cases: normal-smoke,normal-matrix,modal-delayed,modal-stuck,focus-missing,focus-hidden,late-pageerror,cleanup-failure,runner-timeout
          - suite: clip
            cases: focus-clipped
    env:
      TMPDIR: ${{ runner.temp }}/museum-wave1
      TMP: ${{ runner.temp }}/museum-wave1
      TEMP: ${{ runner.temp }}/museum-wave1
      npm_config_cache: ${{ runner.temp }}/museum-wave1/npm-cache
    steps:
      - name: Prepare per-job temporary area
        run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/prepare-work.py
      - run: npm ci --ignore-scripts
        working-directory: .work/v10
      - run: npm run build
        working-directory: .work/v10
      - run: npm ci --ignore-scripts
        working-directory: tools/stage-a-browser
      - run: npx playwright install --with-deps chromium webkit
        working-directory: tools/stage-a-browser
      - name: Normal smoke 12 / matrix 40 and real-browser negative controls
        working-directory: .work/v10
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/tools/stage-a-browser/node_modules
          EVIDENCE_DIR: evidence/ra-acceptance
          ACCEPTANCE_CASES: ${{ matrix.cases }}
        run: |
          node scripts/stage2r-browser-acceptance.cjs
          if [ "${{ matrix.suite }}" = "clip" ]; then
            EVIDENCE_DIR=evidence/ra-acceptance/focus-controls node scripts/stage2r-focus-controls.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-a-browser-${{ matrix.suite }}-${{ github.sha }}
          path: .work/v10/evidence/ra-acceptance/
          if-no-files-found: error
  browser-v11:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: ${{ runner.temp }}/museum-wave1
      TMP: ${{ runner.temp }}/museum-wave1
      TEMP: ${{ runner.temp }}/museum-wave1
      npm_config_cache: ${{ runner.temp }}/museum-wave1/npm-cache
    steps:
      - name: Prepare per-job temporary area
        run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/v11/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/v11
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/v11
      - run: python3 scripts/prepare-work.py
      - name: Stage A smoke on Linux
        run: node scripts/stage2r-smoke.cjs
        working-directory: .work/v10
        timeout-minutes: 5
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/apps/v11/node_modules
          EVIDENCE_DIR: ${{ github.workspace }}/.work/stage-a-linux
      - run: node apps/v11/run-browser-ci.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-browser-verification-${{ github.sha }}
          path: |
            .work/v11-ci-evidence/
            .work/stage-a-linux/
          if-no-files-found: warn

  kanban-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2
    env:
      TMPDIR: ${{ runner.temp }}/museum-wave1
      TMP: ${{ runner.temp }}/museum-wave1
      TEMP: ${{ runner.temp }}/museum-wave1
      npm_config_cache: ${{ runner.temp }}/museum-wave1/npm-cache
    steps:
      - name: Prepare per-job temporary area
        run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci --ignore-scripts
        working-directory: apps/v11
      - name: Native select label images, 24 operations, real old HEAD and failure controls
        run: node apps/v11/run-kanban-ci.cjs
        env:
          KANBAN_INJECT_REVIEW_ERASURE: ${{ github.event_name == 'workflow_dispatch' && inputs.kanban_failure_control && '1' || '0' }}
      - name: Audit CLI complete evidence, RED GREEN and incomplete evidence controls
        id: audit-tests
        run: node apps/v11/kanban-audit.test.cjs .work/kanban-ci .work/kanban-audit-cli
        env:
          KANBAN_AUDIT_TEST_FORCE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.kanban_audit_test_failure && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.audit-tests.outcome != 'skipped'
        with:
          name: kanban-audit-cli-${{ github.event.pull_request.head.sha || github.sha }}
          path: .work/kanban-audit-cli/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanban-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: .work/kanban-ci/
          if-no-files-found: error

