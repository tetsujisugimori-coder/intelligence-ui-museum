name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-migration.py
      - run: npm run test:runner
      - run: python3 apps/v11/verify.py
      - run: node --check apps/v11/exhibits.js
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/v10/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/prepare-work.py
      - run: npm ci --ignore-scripts
        working-directory: .work/v10
      - run: npm run build
        working-directory: .work/v10
      - run: npm test
        working-directory: .work/v10
      - run: node scripts/verify-baseline.mjs
        working-directory: .work/v10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-verification-${{ github.sha }}
          path: |
            .work/v10/dist/
            .work/v10/evidence/authenticity-tests.json
  browser-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/v11/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/v11
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/v11
      - run: node apps/v11/run-browser-ci.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-browser-verification-${{ github.sha }}
          path: .work/v11-ci-evidence/
          if-no-files-found: warn
