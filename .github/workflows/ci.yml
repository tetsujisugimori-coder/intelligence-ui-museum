name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-migration.py
      - run: npm run test:runner
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/v10/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/prepare-work.py
      - run: npm ci --ignore-scripts
        working-directory: .work/v10
      - run: npm run build
        working-directory: .work/v10
      - run: npm test
        working-directory: .work/v10
      - run: node scripts/verify-baseline.mjs
        working-directory: .work/v10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-verification-${{ github.sha }}
          path: |
            .work/v10/dist/
            .work/v10/evidence/authenticity-tests.json

  browser-stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/prepare-work.py
      - run: npm ci --ignore-scripts
        working-directory: .work/v10
      - run: npm run build
        working-directory: .work/v10
      - run: npm ci --ignore-scripts
        working-directory: tools/stage-a-browser
      - run: npx playwright install --with-deps chromium webkit
        working-directory: tools/stage-a-browser
      - name: Normal smoke 12 / matrix 40 and real-browser negative controls
        working-directory: .work/v10
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/tools/stage-a-browser/node_modules
          EVIDENCE_DIR: evidence/ra-acceptance
        run: node scripts/stage2r-browser-acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-a-browser-${{ github.sha }}
          path: .work/v10/evidence/ra-acceptance/
          if-no-files-found: error

